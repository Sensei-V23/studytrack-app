<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StudyTrack TH - ระบบบันทึกงานห้องเรียน</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-512.png" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #263349;
      --bg-input: #0b1120;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 92px;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Top Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #0f172a;
      font-weight: 700;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .room-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 10px;
      border-radius: 999px;
      margin-top: 4px;
      cursor: pointer;
    }

    .sync-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .dot.online {
      background: var(--success);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Buttons & Inputs */
    button, input, select, textarea {
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 8px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .stat-card:hover, .stat-card.active {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Filter Bar */
    .filter-bar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    .input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      transition: 0.15s ease;
    }

    .task-card:hover {
      background: var(--bg-card-hover);
    }

    .task-card.done {
      opacity: 0.65;
    }

    .task-card.done .task-title {
      text-decoration: line-through;
    }

    .task-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .subject-tag {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      color: #0f172a;
    }

    .due-badge {
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-main);
    }

    .due-badge.urgent {
      background: rgba(244, 63, 94, 0.2);
      color: #fda4af;
    }

    .due-badge.soon {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      white-space: pre-line;
    }

    .task-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--text-muted);
    }

    /* Bottom Mobile Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30, 41, 59, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 12px;
      z-index: 50;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 10px;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn i {
      font-size: 1.15rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.12);
    }

    .room-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .room-code-big {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--accent);
      text-align: center;
      margin: 8px 0;
    }

    @media (max-width: 680px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .filter-bar {
        grid-template-columns: 1fr;
      }
      .task-card {
        flex-direction: column;
      }
      .task-actions {
        flex-direction: row;
        width: 100%;
      }
      .task-actions .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-book-open"></i></div>
        <div>
          <h1>StudyTrack TH</h1>
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
            <span class="room-badge" onclick="openRoomModal()" title="เปลี่ยนหรือแชร์รหัสห้อง">
              <i class="fa-solid fa-users"></i>
              <span id="currentRoomLabel">กำลังโหลดห้อง...</span>
            </span>
            <span class="sync-status">
              <span class="dot" id="syncDot"></span>
              <span id="syncText">กำลังเชื่อมต่อ...</span>
            </span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="openRoomModal()">
          <i class="fa-solid fa-key"></i> ห้องเรียน
        </button>
        <button class="btn btn-secondary btn-sm" onclick="openSubjectModal()">
          <i class="fa-solid fa-palette"></i> รายวิชา
        </button>
        <button class="btn btn-primary btn-sm" onclick="openTaskModal()">
          <i class="fa-solid fa-plus"></i> เพิ่มงาน
        </button>
      </div>
    </header>

    <!-- Stats -->
    <section class="stats-grid">
      <div class="stat-card active" data-filter="all" onclick="setStatusFilter('all')">
        <div class="stat-label">งานทั้งหมด</div>
        <div class="stat-value" id="statAll">0</div>
      </div>
      <div class="stat-card" data-filter="pending" onclick="setStatusFilter('pending')">
        <div class="stat-label">ยังไม่เสร็จ</div>
        <div class="stat-value" id="statPending" style="color:var(--accent);">0</div>
      </div>
      <div class="stat-card" data-filter="urgent" onclick="setStatusFilter('urgent')">
        <div class="stat-label">ใกล้ส่ง / เลยกำหนด</div>
        <div class="stat-value" id="statUrgent" style="color:var(--danger);">0</div>
      </div>
      <div class="stat-card" data-filter="done" onclick="setStatusFilter('done')">
        <div class="stat-label">เสร็จแล้ว</div>
        <div class="stat-value" id="statDone" style="color:var(--success);">0</div>
      </div>
    </section>

    <!-- Search & Filter -->
    <section class="filter-bar">
      <input type="text" id="searchInput" class="input" placeholder="🔍 ค้นหาชื่องาน หรือรายละเอียด..." oninput="renderTasks()" />
      <select id="subjectFilter" onchange="renderTasks()">
        <option value="all">ทุกวิชา</option>
      </select>
      <select id="sortSelect" onchange="renderTasks()">
        <option value="dueAsc">เรียงตามวันส่ง (เร็วสุดก่อน)</option>
        <option value="priorityDesc">เรียงตามความเร่งด่วน</option>
        <option value="newest">เพิ่มล่าสุดก่อน</option>
      </select>
    </section>

    <!-- Task List -->
    <main class="task-list" id="taskList"></main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="setStatusFilter('all'); setActiveNav(this)">
      <i class="fa-solid fa-house"></i>
      <span>งานทั้งหมด</span>
    </button>
    <button class="nav-btn" onclick="openTaskModal()">
      <i class="fa-solid fa-circle-plus"></i>
      <span>เพิ่มงาน</span>
    </button>
    <button class="nav-btn" onclick="openRoomModal()">
      <i class="fa-solid fa-share-nodes"></i>
      <span>แชร์รหัสห้อง</span>
    </button>
    <button class="nav-btn" onclick="openSubjectModal()">
      <i class="fa-solid fa-layer-group"></i>
      <span>รายวิชา</span>
    </button>
  </nav>

  <!-- Task Modal -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="taskModalTitle">เพิ่มงานใหม่</h2>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('taskModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="taskForm" onsubmit="saveTask(event)">
        <input type="hidden" id="editTaskId" />
        <div class="form-group">
          <label>รายวิชา *</label>
          <select id="taskSubject" required></select>
        </div>
        <div class="form-group">
          <label>ชื่องาน / การบ้าน *</label>
          <input type="text" id="taskTitle" class="input" placeholder="เช่น แบบฝึกหัดหน้า 24-26" required />
        </div>
        <div class="form-group">
          <label>วันกำหนดส่ง *</label>
          <input type="date" id="taskDueDate" class="input" required />
        </div>
        <div class="form-group">
          <label>ความเร่งด่วน</label>
          <select id="taskPriority">
            <option value="normal">ปกติ</option>
            <option value="urgent">ด่วนมาก</option>
            <option value="chill">ชิลล์ๆ</option>
          </select>
        </div>
        <div class="form-group">
          <label>ผู้บันทึก (ชื่อเล่น)</label>
          <input type="text" id="taskAuthor" class="input" placeholder="เช่น แอดมิน / สมชาย" />
        </div>
        <div class="form-group">
          <label>รายละเอียดเพิ่มเติม</label>
          <textarea id="taskDesc" rows="3" placeholder="ระบุหน้าหนังสือ เลขข้อ หรือคำสั่งครู..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">
          <i class="fa-solid fa-check"></i> บันทึกลงห้องเรียน
        </button>
      </form>
    </div>
  </div>

  <!-- Room Modal -->
  <div class="modal-backdrop" id="roomModal">
    <div class="modal">
      <div class="modal-header">
        <h2>จัดการห้องเรียน / แชร์รหัสให้เพื่อน</h2>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('roomModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="room-box">
        <div style="font-size:0.82rem; color:var(--text-muted);">รหัสห้องปัจจุบัน (ส่งให้เพื่อนกรอกเพื่อดูและแก้ไขอันเดียวกัน)</div>
        <div class="room-code-big" id="modalRoomCode">------</div>
        <div style="display:flex; gap:8px; justify-content:center;">
          <button class="btn btn-secondary btn-sm" onclick="copyRoomCode()">
            <i class="fa-regular fa-copy"></i> คัดลอกรหัส
          </button>
          <button class="btn btn-secondary btn-sm" onclick="shareAppLink()">
            <i class="fa-solid fa-share"></i> แชร์ลิงก์แอป
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>เข้าร่วมห้องที่มีอยู่แล้ว (กรอกรหัส 6 ตัว)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="joinRoomInput" class="input" maxlength="8" placeholder="เช่น A1B2C3" style="text-transform:uppercase;" />
          <button class="btn btn-primary" onclick="joinRoomFromInput()">เข้าร่วม</button>
        </div>
      </div>

      <div class="form-group">
        <label>สร้างห้องเรียนใหม่</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newRoomNameInput" class="input" placeholder="ชื่อห้อง เช่น ม.3/2 หรือ กลุ่มวิทย์" />
          <button class="btn btn-secondary" onclick="createNewRoom()">สร้างห้อง</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Subject Modal -->
  <div class="modal-backdrop" id="subjectModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="subjectModalTitle">จัดการรายวิชาในห้องนี้</h2>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('subjectModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="saveSubject(event)" style="margin-bottom:16px;">
        <input type="hidden" id="editSubjectIndex" value="-1" />
        <div class="form-group">
          <label id="subjectFormLabel">ชื่อรายวิชาใหม่</label>
          <input type="text" id="newSubjectName" class="input" placeholder="เช่น ฟิสิกส์, สังคมศึกษา" required />
        </div>
        <div class="form-group">
          <label>เลือกสีพาสเทลประจำวิชา</label>
          <div class="color-row" id="colorSwatchRow"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn btn-primary" style="flex:1;" id="subjectSubmitBtn">
            <i class="fa-solid fa-plus"></i> เพิ่มรายวิชา
          </button>
          <button type="button" class="btn btn-secondary" id="cancelEditSubjectBtn" style="display:none;" onclick="resetSubjectForm()">
            ยกเลิก
          </button>
        </div>
      </form>

      <div id="subjectListPreview" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- Firebase SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, collection, addDoc, updateDoc, deleteDoc,
      onSnapshot, query, where, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrfRQ0CrsxmUPJNLchKhsgp62JTcmexqk",
      authDomain: "studytrack-th.firebaseapp.com",
      projectId: "studytrack-th",
      storageBucket: "studytrack-th.firebasestorage.app",
      messagingSenderId: "448843127744",
      appId: "1:448843127744:web:80c2b3069511e4c8e40625",
      measurementId: "G-Q0P273H0HD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const PASTEL_COLORS = [
      "#93c5fd", "#86efac", "#fde047", "#fca5a5", "#c4b5fd",
      "#67e8f9", "#fdba74", "#f9a8d4", "#a5f3fc", "#bef264"
    ];

    const DEFAULT_SUBJECTS = [
      { name: "คณิตศาสตร์", color: "#93c5fd" },
      { name: "วิทยาศาสตร์", color: "#86efac" },
      { name: "ภาษาไทย", color: "#fde047" },
      { name: "ภาษาอังกฤษ", color: "#c4b5fd" },
      { name: "สังคมศึกษา", color: "#fdba74" },
      { name: "วิทยาการคำนวณ", color: "#67e8f9" }
    ];

    let currentUser = null;
    let currentRoomId = localStorage.getItem("studytrack_room_id") || "";
    let currentRoomName = localStorage.getItem("studytrack_room_name") || "";
    let subjects = [...DEFAULT_SUBJECTS];
    let tasks = [];
    let statusFilter = "all";
    let selectedColor = PASTEL_COLORS[0];
    let unsubscribeTasks = null;
    let unsubscribeRoom = null;

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => console.log("SW:", err));
      });
    }

    function generateCode(len = 6) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < len; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function setSyncStatus(online, text) {
      const dot = document.getElementById("syncDot");
      const label = document.getElementById("syncText");
      dot.classList.toggle("online", online);
      label.textContent = text;
    }

    async function ensureRoomExists(roomId, roomName = "ห้องเรียนของฉัน") {
      const roomRef = doc(db, "rooms", roomId);
      const snap = await getDoc(roomRef);
      if (!snap.exists()) {
        await setDoc(roomRef, {
          name: roomName,
          subjects: DEFAULT_SUBJECTS,
          createdBy: currentUser?.uid || "anonymous",
          createdAt: serverTimestamp()
        });
        subjects = [...DEFAULT_SUBJECTS];
      } else {
        const data = snap.data();
        roomName = data.name || roomId;
        subjects = Array.isArray(data.subjects) && data.subjects.length ? data.subjects : [...DEFAULT_SUBJECTS];
      }

      currentRoomId = roomId;
      currentRoomName = roomName;
      localStorage.setItem("studytrack_room_id", roomId);
      localStorage.setItem("studytrack_room_name", roomName);
      updateRoomUI();
      subscribeToRoomData(roomId);
    }

    function updateRoomUI() {
      document.getElementById("currentRoomLabel").textContent = `${currentRoomName} (${currentRoomId})`;
      document.getElementById("modalRoomCode").textContent = currentRoomId;
      renderSubjectOptions();
      renderSubjectPreview();
    }

    function subscribeToRoomData(roomId) {
      if (unsubscribeTasks) unsubscribeTasks();
      if (unsubscribeRoom) unsubscribeRoom();

      unsubscribeRoom = onSnapshot(doc(db, "rooms", roomId), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          currentRoomName = data.name || roomId;
          localStorage.setItem("studytrack_room_name", currentRoomName);
          if (Array.isArray(data.subjects) && data.subjects.length) {
            subjects = data.subjects;
          }
          updateRoomUI();
          renderTasks();
        }
      });

      const q = query(collection(db, "tasks"), where("roomId", "==", roomId));
      unsubscribeTasks = onSnapshot(
        q,
        (snapshot) => {
          tasks = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          setSyncStatus(true, "ซิงก์ Real-time แล้ว");
          updateStats();
          renderTasks();
        },
        (error) => {
          console.error(error);
          setSyncStatus(false, "ตรวจสอบ Firestore Rules");
        }
      );
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        setSyncStatus(true, "กำลังโหลดห้องเรียน...");
        const targetRoom = currentRoomId || generateCode(6);
        await ensureRoomExists(targetRoom, currentRoomName || "ห้องเรียนเริ่มต้น");
      }
    });

    signInAnonymously(auth).catch((err) => {
      console.error("Auth error:", err);
      setSyncStatus(false, "กรุณาเปิด Anonymous Auth ใน Firebase");
    });

    window.openModal = (id) => document.getElementById(id).classList.add("open");
    window.closeModal = (id) => document.getElementById(id).classList.remove("open");

    window.setActiveNav = (btn) => {
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    };

    window.setStatusFilter = (filter) => {
      statusFilter = filter;
      document.querySelectorAll(".stat-card").forEach((card) => {
        card.classList.toggle("active", card.dataset.filter === filter);
      });
      renderTasks();
    };

    window.openRoomModal = () => {
      document.getElementById("modalRoomCode").textContent = currentRoomId || "------";
      openModal("roomModal");
    };

    window.copyRoomCode = async () => {
      if (!currentRoomId) return;
      await navigator.clipboard?.writeText(currentRoomId);
      alert(`คัดลอกรหัสห้อง "${currentRoomId}" แล้ว ส่งให้เพื่อนได้เลย!`);
    };

    window.shareAppLink = async () => {
      const shareText = `เข้าร่วมห้องเรียน "${currentRoomName}" บน StudyTrack TH ด้วยรหัส: ${currentRoomId}`;
      if (navigator.share) {
        await navigator.share({ title: "StudyTrack TH", text: shareText, url: window.location.href }).catch(() => {});
      } else {
        await navigator.clipboard?.writeText(`${shareText}\n${window.location.href}`);
        alert("คัดลอกข้อความเชิญและลิงก์แอปเรียบร้อยแล้ว!");
      }
    };

    window.joinRoomFromInput = async () => {
      const code = document.getElementById("joinRoomInput").value.trim().toUpperCase();
      if (!code) return alert("กรุณากรอกรหัสห้องก่อนครับ");
      const snap = await getDoc(doc(db, "rooms", code));
      if (!snap.exists()) {
        return alert("ไม่พบรหัสห้องนี้ในระบบ ตรวจสอบรหัสอีกครั้งครับ");
      }
      await ensureRoomExists(code, snap.data().name || code);
      document.getElementById("joinRoomInput").value = "";
      closeModal("roomModal");
    };

    window.createNewRoom = async () => {
      const nameInput = document.getElementById("newRoomNameInput").value.trim() || "ห้องเรียนใหม่";
      const code = generateCode(6);
      await ensureRoomExists(code, nameInput);
      document.getElementById("newRoomNameInput").value = "";
      closeModal("roomModal");
      alert(`สร้างห้อง "${nameInput}" สำเร็จ! รหัสห้องคือ ${code}`);
    };

    window.openSubjectModal = () => {
      resetSubjectForm();
      renderSubjectPreview();
      openModal("subjectModal");
    };

    window.resetSubjectForm = () => {
      document.getElementById("editSubjectIndex").value = "-1";
      document.getElementById("subjectModalTitle").textContent = "จัดการรายวิชาในห้องนี้";
      document.getElementById("subjectFormLabel").textContent = "ชื่อรายวิชาใหม่";
      document.getElementById("newSubjectName").value = "";
      document.getElementById("subjectSubmitBtn").innerHTML = '<i class="fa-solid fa-plus"></i> เพิ่มรายวิชา';
      document.getElementById("cancelEditSubjectBtn").style.display = "none";
      selectedColor = PASTEL_COLORS[0];
      initColorSwatches();
    };

    window.startEditSubject = (idx) => {
      const subj = subjects[idx];
      if (!subj) return;
      document.getElementById("editSubjectIndex").value = String(idx);
      document.getElementById("subjectModalTitle").textContent = "แก้ไขรายวิชา";
      document.getElementById("subjectFormLabel").textContent = "แก้ไขชื่อรายวิชา";
      document.getElementById("newSubjectName").value = subj.name;
      document.getElementById("subjectSubmitBtn").innerHTML = '<i class="fa-solid fa-check"></i> บันทึกการแก้ไข';
      document.getElementById("cancelEditSubjectBtn").style.display = "inline-flex";
      selectedColor = subj.color || PASTEL_COLORS[0];
      initColorSwatches();
    };

    function initColorSwatches() {
      const row = document.getElementById("colorSwatchRow");
      row.innerHTML = "";
      PASTEL_COLORS.forEach((color) => {
        const div = document.createElement("div");
        div.className = "color-swatch" + (color === selectedColor ? " selected" : "");
        div.style.backgroundColor = color;
        div.onclick = () => {
          selectedColor = color;
          initColorSwatches();
        };
        row.appendChild(div);
      });
    }

    function renderSubjectPreview() {
      const wrap = document.getElementById("subjectListPreview");
      if (!subjects.length) {
        wrap.innerHTML = `<div style="font-size:0.84rem; color:var(--text-muted);">ยังไม่มีรายวิชาในห้องนี้</div>`;
        return;
      }

      wrap.innerHTML = subjects
        .map(
          (s, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--bg-input); border:1px solid var(--border); padding:8px 12px; border-radius:10px;">
            <span class="subject-tag" style="background:${s.color};">${escapeHtml(s.name)}</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="startEditSubject(${idx})">
                <i class="fa-solid fa-pen"></i> แก้ไข
              </button>
              <button type="button" class="btn btn-danger btn-sm" onclick="deleteSubject(${idx})">
                <i class="fa-solid fa-trash"></i> ลบ
              </button>
            </div>
          </div>`
        )
        .join("");
    }

    window.saveSubject = async (e) => {
      e.preventDefault();
      const name = document.getElementById("newSubjectName").value.trim();
      const editIdx = Number(document.getElementById("editSubjectIndex").value);
      if (!name || !currentRoomId) return;

      const duplicate = subjects.some((s, i) => s.name === name && i !== editIdx);
      if (duplicate) {
        return alert("มีรายวิชานี้อยู่แล้วครับ");
      }

      let updated = [...subjects];
      if (editIdx >= 0 && updated[editIdx]) {
        const oldName = updated[editIdx].name;
        updated[editIdx] = { name, color: selectedColor };

        if (oldName !== name) {
          const matchingTasks = tasks.filter((t) => t.subject === oldName);
          await Promise.all(
            matchingTasks.map((t) => updateDoc(doc(db, "tasks", t.id), { subject: name }))
          );
        }
      } else {
        updated.push({ name, color: selectedColor });
      }

      await updateDoc(doc(db, "rooms", currentRoomId), { subjects: updated });
      subjects = updated;
      resetSubjectForm();
      updateRoomUI();
      renderTasks();
    };

    window.deleteSubject = async (idx) => {
      const target = subjects[idx];
      if (!target || !currentRoomId) return;
      if (!confirm(`ต้องการลบรายวิชา "${target.name}" ใช่ไหม?`)) return;

      const updated = subjects.filter((_, i) => i !== idx);
      await updateDoc(doc(db, "rooms", currentRoomId), { subjects: updated });
      subjects = updated;

      if (Number(document.getElementById("editSubjectIndex").value) === idx) {
        resetSubjectForm();
      }
      updateRoomUI();
      renderTasks();
    };

    function renderSubjectOptions() {
      const taskSelect = document.getElementById("taskSubject");
      const filterSelect = document.getElementById("subjectFilter");
      const currentFilterVal = filterSelect.value;

      taskSelect.innerHTML = subjects
        .map((s) => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`)
        .join("");

      filterSelect.innerHTML =
        `<option value="all">ทุกวิชา</option>` +
        subjects.map((s) => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("");

      if ([...filterSelect.options].some((o) => o.value === currentFilterVal)) {
        filterSelect.value = currentFilterVal;
      }
    }

    window.openTaskModal = (taskId = null) => {
      renderSubjectOptions();
      const form = document.getElementById("taskForm");
      form.reset();
      document.getElementById("editTaskId").value = "";
      document.getElementById("taskAuthor").value = localStorage.getItem("studytrack_author") || "";

      if (taskId) {
        const t = tasks.find((item) => item.id === taskId);
        if (!t) return;
        document.getElementById("taskModalTitle").textContent = "แก้ไขงาน";
        document.getElementById("editTaskId").value = t.id;
        document.getElementById("taskSubject").value = t.subject;
        document.getElementById("taskTitle").value = t.title;
        document.getElementById("taskDueDate").value = t.dueDate || "";
        document.getElementById("taskPriority").value = t.priority || "normal";
        document.getElementById("taskAuthor").value = t.author || "";
        document.getElementById("taskDesc").value = t.description || "";
      } else {
        document.getElementById("taskModalTitle").textContent = "เพิ่มงานใหม่";
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("taskDueDate").value = today;
      }
      openModal("taskModal");
    };

    window.saveTask = async (e) => {
      e.preventDefault();
      if (!currentRoomId) return alert("ยังไม่พบห้องเรียนครับ");

      const editId = document.getElementById("editTaskId").value;
      const author = document.getElementById("taskAuthor").value.trim() || "สมาชิกห้อง";
      localStorage.setItem("studytrack_author", author);

      const payload = {
        roomId: currentRoomId,
        subject: document.getElementById("taskSubject").value,
        title: document.getElementById("taskTitle").value.trim(),
        dueDate: document.getElementById("taskDueDate").value,
        priority: document.getElementById("taskPriority").value,
        author,
        description: document.getElementById("taskDesc").value.trim(),
        updatedAt: serverTimestamp()
      };

      if (editId) {
        await updateDoc(doc(db, "tasks", editId), payload);
      } else {
        await addDoc(collection(db, "tasks"), {
          ...payload,
          completed: false,
          createdAt: Date.now()
        });
      }
      closeModal("taskModal");
    };

    window.toggleComplete = async (taskId, currentState) => {
      await updateDoc(doc(db, "tasks", taskId), {
        completed: !currentState,
        updatedAt: serverTimestamp()
      });
    };

    window.deleteTask = async (taskId) => {
      if (!confirm("ต้องการลบงานนี้ออกจากห้องเรียนใช่ไหม?")) return;
      await deleteDoc(doc(db, "tasks", taskId));
    };

    function getDueMeta(dueDateStr, completed) {
      if (!dueDateStr) return { text: "ไม่ระบุวันส่ง", cls: "" };
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const [y, m, d] = dueDateStr.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      const diffDays = Math.round((target - now) / 86400000);

      if (completed) return { text: `กำหนดส่ง ${dueDateStr}`, cls: "" };
      if (diffDays < 0) return { text: `เลยกำหนด ${Math.abs(diffDays)} วัน`, cls: "urgent" };
      if (diffDays === 0) return { text: "ส่งวันนี้!", cls: "urgent" };
      if (diffDays === 1) return { text: "ส่งพรุ่งนี้", cls: "soon" };
      if (diffDays <= 3) return { text: `เหลืออีก ${diffDays} วัน`, cls: "soon" };
      return { text: `เหลืออีก ${diffDays} วัน (${dueDateStr})`, cls: "" };
    }

    function isUrgentOrOverdue(t) {
      if (t.completed || !t.dueDate) return false;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const [y, m, d] = t.dueDate.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      const diffDays = Math.round((target - now) / 86400000);
      return diffDays <= 1 || t.priority === "urgent";
    }

    function updateStats() {
      document.getElementById("statAll").textContent = tasks.length;
      document.getElementById("statPending").textContent = tasks.filter((t) => !t.completed).length;
      document.getElementById("statUrgent").textContent = tasks.filter(isUrgentOrOverdue).length;
      document.getElementById("statDone").textContent = tasks.filter((t) => t.completed).length;
    }

    window.renderTasks = () => {
      const listEl = document.getElementById("taskList");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const subjFilter = document.getElementById("subjectFilter").value;
      const sortMode = document.getElementById("sortSelect").value;

      let filtered = tasks.filter((t) => {
        if (statusFilter === "pending" && t.completed) return false;
        if (statusFilter === "done" && !t.completed) return false;
        if (statusFilter === "urgent" && !isUrgentOrOverdue(t)) return false;
        if (subjFilter !== "all" && t.subject !== subjFilter) return false;
        if (search) {
          const hay = `${t.title || ""} ${t.description || ""} ${t.subject || ""}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      const prioRank = { urgent: 3, normal: 2, chill: 1 };
      filtered.sort((a, b) => {
        if (sortMode === "priorityDesc") {
          return (prioRank[b.priority] || 2) - (prioRank[a.priority] || 2);
        }
        if (sortMode === "newest") {
          return (b.createdAt || 0) - (a.createdAt || 0);
        }
        return (a.dueDate || "9999-12-31").localeCompare(b.dueDate || "9999-12-31");
      });

      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-clipboard-check" style="font-size:2rem; margin-bottom:10px; display:block;"></i>
            <p>ยังไม่มีรายการงานตามเงื่อนไขที่เลือก</p>
            <p style="font-size:0.82rem; margin-top:4px;">กดปุ่ม "เพิ่มงาน" ด้านบน หรือแชร์รหัสห้องให้เพื่อนช่วยอัปเดตได้เลย</p>
          </div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((t) => {
          const subjObj = subjects.find((s) => s.name === t.subject) || { color: "#93c5fd" };
          const due = getDueMeta(t.dueDate, t.completed);
          const prioLabel =
            t.priority === "urgent" ? "🔥 ด่วนมาก" : t.priority === "chill" ? "🍃 ชิลล์ๆ" : "📌 ปกติ";

          return `
            <article class="task-card ${t.completed ? "done" : ""}" style="border-left-color:${subjObj.color};">
              <div>
                <div class="task-top">
                  <span class="subject-tag" style="background:${subjObj.color};">${escapeHtml(t.subject)}</span>
                  <span class="due-badge ${due.cls}">${due.text}</span>
                  <span class="due-badge">${prioLabel}</span>
                </div>
                <div class="task-title">${escapeHtml(t.title)}</div>
                ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ""}
                <div class="task-meta">บันทึกโดย: ${escapeHtml(t.author || "สมาชิกห้อง")}</div>
              </div>
              <div class="task-actions">
                <button class="btn ${t.completed ? "btn-secondary" : "btn-primary"} btn-sm" onclick="toggleComplete('${t.id}', ${Boolean(t.completed)})">
                  <i class="fa-solid ${t.completed ? "fa-rotate-left" : "fa-check"}"></i>
                  ${t.completed ? "ยกเลิกเสร็จ" : "เสร็จแล้ว"}
                </button>
                <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${t.id}')">
                  <i class="fa-solid fa-pen"></i> แก้ไข
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">
                  <i class="fa-solid fa-trash"></i> ลบ
                </button>
              </div>
            </article>`;
        })
        .join("");
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
